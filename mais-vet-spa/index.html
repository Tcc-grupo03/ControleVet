<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MaisVet · Clínica Viva Pet</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://kit.fontawesome.com/c7bcd5f448.js" crossorigin="anonymous"></script>
</head>

<body>
  <div id="app">
    <aside id="menu" class="menu oculto">
      <div class="cabecalho-menu">
        <button id="btn-menu" class="btn-menu" type="button" aria-label="Recolher menu" aria-expanded="true"
          aria-controls="navegacao-menu">
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </button>
        <div class="marca">MaisVet</div>
      </div>
      <nav id="navegacao-menu">
        <a href="#visao-geral" aria-label="Visão geral" title="Visão geral">
          <span class="rotulo-nav" aria-hidden="true">Visão geral <i class="fa-solid fa-house"></i></span>
          <span class="atalho-nav" aria-hidden="true"><i class="fa-solid fa-house"></i></span></a>
        <a href="#agenda" aria-label="Agenda" title="Agenda">
          <span class="rotulo-nav" aria-hidden="true">Agenda <i class="fa-solid fa-calendar"></i></span>
          <span class="atalho-nav" aria-hidden="true"><i class="fa-solid fa-calendar"></i></span></a>
        <a href="#pacientes" aria-label="Pacientes" title="Pacientes">
          <span class="rotulo-nav" aria-hidden="true">Pacientes <i class="fa-solid fa-paw"></i></span>
          <span class="atalho-nav" aria-hidden="true"><i class="fa-solid fa-paw"></i></span></a>
        <a href="#clientes" aria-label="Clientes" title="Clientes">
          <span class="rotulo-nav" aria-hidden="true">Clientes <i class="fa-solid fa-id-card"></i></span>
          <span class="atalho-nav" aria-hidden="true"><i class="fa-solid fa-id-card"></i></span></a>
        <a href="#procedimentos" aria-label="Procedimentos" title="Procedimentos">
          <span class="rotulo-nav" aria-hidden="true">Procedimentos <i class="fa-solid fa-file-medical"></i></span>
          <span class="atalho-nav" aria-hidden="true"><i class="fa-solid fa-file-medical"></i></span></a>
        <a href="#clinicos" aria-label="Clínicos cadastrados" title="Clínicos cadastrados">
          <span class="rotulo-nav" aria-hidden="true">Funcionários <i class="fa-solid fa-users"></i></span>
          <span class="atalho-nav" aria-hidden="true"><i class="fa-solid fa-users"></i></span></a>
        <a href="#financeiro" aria-label="Financeiro" title="Financeiro">
          <span class="rotulo-nav" aria-hidden="true">Financeiro <i class="fa-brands fa-cash-app fa-lg"></i></span>
          <span class="atalho-nav" aria-hidden="true"><i class="fa-brands fa-cash-app fa-lg"></i></span></a>
        <a href="#relatorios" aria-label="Relatórios" title="Relatórios">
          <span class="rotulo-nav" aria-hidden="true">Relatórios <i class="fa-solid fa-chart-simple"></i></span>
          <span class="atalho-nav" aria-hidden="true"><i class="fa-solid fa-chart-simple"></i></span></a>
        <a href="#configuracoes" aria-label="Configurações" title="Configurações">
          <span class="rotulo-nav" aria-hidden="true">Configurações <i class="fa-solid fa-gear"></i></span>
          <span class="atalho-nav" aria-hidden="true"><i class="fa-solid fa-gear"></i></span></a>
      </nav>
      <button id="btn-sair" class="btn-secundario" aria-label="Sair da conta" title="Sair da conta">
        <span class="rotulo-sair" aria-hidden="true">Sair da conta <i class="fa-solid fa-arrow-right-from-bracket"></i></span>
        <span class="atalho-sair" aria-hidden="true"><i class="fa-solid fa-arrow-right-from-bracket"></i></span>
      </button>
    </aside>

    <main id="conteudo"></main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>

</html>
