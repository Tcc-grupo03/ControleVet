<section class="login">
  <h1>Entrar na minha conta</h1>
  <p class="texto-apoio">Entre na sua conta para cuidar do que importa.</p>

  <form id="form-login" novalidate>
    <label>
      E-mail
      <input type="email" id="email" placeholder="seuemail@clinica.com.br" required>
    </label>
    <label>
      Senha
      <input type="password" id="senha" required>
    </label>
    <p id="erro-login" class="erro"></p>
    <button type="submit" class="btn-primario" style="width:100%">Entrar</button>
  </form>

  <p style="margin-top:20px">Ainda não tem uma conta? <a href="#cadastro">Criar conta</a></p>
</section>
